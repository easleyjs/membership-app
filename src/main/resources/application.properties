spring.application.name=membership
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
spring.profiles.active=dev
app.public-base-url=${APP_PUBLIC_BASE_URL:}
spring.datasource.url=jdbc:postgresql://localhost:5432/memberships
spring.datasource.username=membership
spring.datasource.password=${POSTGRES_PASSWORD}
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
#---
spring.config.activate.on-profile=dev
spring.config.import=optional:file:./dev.env[.properties]
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
