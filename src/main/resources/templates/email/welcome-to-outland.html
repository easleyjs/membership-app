<!doctype html>
<html lang="en">
<head>

    <style>
        html, body {
            margin: 0 !important;

            background-color: #000000 !important;
        }

        :root {
            color-scheme: light only;

</head>
<body   bgcolor="#000000"
        style="margin:0; padding:0;
        background-color:#000000;
        color:#ffffff; font-family:Arial, Helvetica, sans-serif;"
>
<table role="presentation"
       width="100%"
       cellspacing="0"
       cellpadding="0"
       border="0"
       bgcolor="#000000"
       style="width:100%;
              background-color:#000000;
              border-collapse:collapse;
              margin:0;
              padding:0;">
    <tr>
        <td align="center"
            bgcolor="#000000"
            style="background-color:#000000; padding:0;">
                <!--[if mso]><table role="presentation" width="560" cellspacing="0" cellpadding="0" border="0"><tr><td><![endif]-->
            <table role="presentation"
                   width="100%"
                   cellspacing="0"
                   cellpadding="0"
                   border="0"
                   bgcolor="#000000"
                   style="background-color:#000000;
              border-collapse:collapse;">
                    <tr>
                        <td align="center" style="padding:36px 24px 22px;">
                            <h1 style="margin:0; color:#ff69b4; font-size:30px; line-height:1.15; font-weight:800; letter-spacing:1px;">WELCOME TO OUTLAND</h1>
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding:0 24px 28px;">
                            <p style="margin:0; color:#ffffff; font-size:16px; line-height:1.6;">Welcome, &lt;member name&gt;. Save this email and show your member QR code at the door when you check in.</p>
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding:0 16px 36px;">
                            <table role="presentation" width="232" cellspacing="0" cellpadding="0" border="0" bgcolor="#000000">
                                <tr>
                                    <td align="center" style="padding:20px;">
                                        <!-- Preview values. Use the member number and inline QR image when sending. -->
                                        <img src="welcome-member-qr.png" width="192" height="192" alt="Member QR code for check-in"
                                             style="display:block; width:192px; height:192px; border:0; color:#ffffff;">
                                        <p style="margin:14px 0 0; color:#ffffff; font-size:16px; line-height:1.4; font-weight:bold;">Member: 123456</p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
                <!--[if mso]></td></tr></table><![endif]-->
            </td>
        </tr>
    </table>
