<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Portal · Sign in</title>
<link rel="stylesheet" href="css/login.css">
</head>
<body>

  <main class="login-layout">
    <img class="organization-logo" src="images/outland.svg" alt="Outland" width="887" height="391">

    <div class="card">
      <h1>Sign in</h1>
      <p class="sub">Enter your credentials</p>

      <div class="error" id="errorMsg" role="alert"></div>

      <form id="loginForm" method="post" action="/api/auth/login" autocomplete="on">
        <div class="field">
          <label for="username">Email</label>
          <input type="email" id="username" name="username" placeholder="name@example.com" autocomplete="username" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <button type="submit">Sign in</button>
      </form>

      <div class="forgot-wrap">
        <a href="#">Forgot email or password?</a>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const errorMsg = document.getElementById('errorMsg');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');

    function showLoginError(message){
      errorMsg.textContent = message || 'Incorrect email or password.';
      errorMsg.classList.add('visible', 'shake');
      // restart the shake animation if it's already showing
      errorMsg.addEventListener('animationend', () => {
        errorMsg.classList.remove('shake');
      }, { once: true });
    }

    function hideLoginError(){
      errorMsg.classList.remove('visible');
    }

    // Hide the error as soon as the person starts correcting their input
    usernameInput.addEventListener('input', hideLoginError);
    passwordInput.addEventListener('input', hideLoginError);

    document.getElementById('loginForm').addEventListener('submit', async function(e){
      e.preventDefault();
      const submit = this.querySelector('button[type="submit"]');
      if (submit.disabled) return;
      submit.disabled = true;

      try {
        await App.auth.login(usernameInput.value, passwordInput.value);
        window.location.replace('members.html');
      } catch (err) {
        showLoginError(err.message);
        submit.disabled = false;
      }
    });
  </script>

</body>
</html>
