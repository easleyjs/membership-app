<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile · OUTLAND</title>
  <link rel="stylesheet" href="css/members.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body class="session-pending">
  <p id="sessionStatus" role="status">Restoring your session…</p>
  <header class="header">
    <div class="header-top">
      <h1>OUTLAND</h1>
      <a class="profile-back" href="members.html">Back to portal</a>
    </div>
  </header>
  <main class="profile-layout">
    <h1>Profile</h1>
    <p class="profile-identity" id="profileIdentity"></p>
    <section class="profile-card" aria-labelledby="passwordHeading">
      <h2 id="passwordHeading">Change password</h2>
      <p class="profile-help" id="passwordHelp">Use at least 12 characters.</p>
      <form id="passwordForm">
        <div class="profile-field">
          <label for="currentPassword">Current password</label>
          <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" maxlength="1024" required>
        </div>
        <div class="profile-field">
          <label for="newPassword">New password</label>
          <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" aria-describedby="passwordHelp" required>
        </div>
        <div class="profile-field">
          <label for="confirmPassword">Confirm new password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
        </div>
        <p class="profile-feedback" id="passwordFeedback" role="status" aria-live="polite" hidden></p>
        <button class="modal-btn modal-btn-accent" id="savePassword" type="submit">Update password</button>
      </form>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
