<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>OUTLAND · Set your password</title>
  <link rel="stylesheet" href="css/login.css">
  <script src="js/api.js" defer></script>
  <script src="js/set-password.js" defer></script>
</head>
<body>
  <main class="login-layout">
    <img class="organization-logo" src="images/outland.svg" alt="Outland" width="887" height="391">
    <div class="card">
      <h1>Set your password</h1>
      <p class="sub" id="passwordHelp">Use at least 12 characters. Sign in with your email address after setup.</p>
      <div class="error" id="inviteError" role="alert"></div>
      <form id="inviteForm" method="post" action="/api/auth/accept-invite" style="display:none">
        <div class="field">
          <label for="password">New password</label>
          <input type="password" id="password" autocomplete="new-password" aria-describedby="passwordHelp" minlength="12" maxlength="72" required>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" autocomplete="new-password" maxlength="72" required>
        </div>
        <button type="submit">Set password</button>
      </form>
      <div class="forgot-wrap"><a href="login.html">Go to sign in</a></div>
    </div>
  </main>
</body>
</html>
