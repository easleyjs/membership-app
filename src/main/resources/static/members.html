<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OUTLAND Admin</title>
<link rel="stylesheet" href="css/members.css">
</head>
<body class="session-pending">

  <p id="sessionStatus" role="status">Restoring your session…</p>

  <header class="header">
    <div class="header-top">
      <h1>OUTLAND Admin</h1>
      <div class="user-menu">
        <button class="user-avatar" id="userMenuBtn" aria-haspopup="true" aria-expanded="false"></button>
        <div class="user-dropdown" id="userDropdown">
          <button class="user-dropdown-item" id="profileBtn">Profile</button>
          <button class="user-dropdown-item" id="switchModeBtn">Switch to Door</button>
          <button class="user-dropdown-item is-danger" id="logoutBtn">Logout</button>
        </div>
      </div>
    </div>
    <div class="door-only event-picker">
      <label for="doorEvent">Event</label>
      <select id="doorEvent" disabled>
        <option value="">Loading events…</option>
      </select>
    </div>
    <button class="scan-btn" id="scanBtn" type="button" aria-haspopup="dialog" aria-controls="scanDialog">SCAN</button>
    <nav class="admin-sections modal-pills admin-only" id="adminSections" aria-label="Manage">
      <button class="chip" type="button" data-section="members" aria-pressed="true">Members</button>
      <button class="chip" type="button" data-section="users" aria-pressed="false">Users</button>
      <button class="chip" type="button" data-section="events" aria-pressed="false">Events</button>
    </nav>
    <h2 class="search-heading"><label for="search">Search</label></h2>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="search" aria-label="Search by name, member number, or email" placeholder="Name, member number, or email">
      <button class="clear-search" id="clearSearch" aria-label="Clear search" type="button">✕</button>
    </div>
  </header>

  <nav class="chips" id="chips" aria-label="Search filters">
    <button class="chip active" data-filter="all" aria-pressed="true">All</button>
    <button class="chip door-only" id="checkedInFilter" data-filter="checked-in" aria-pressed="false" disabled>Checked In</button>
    <button class="chip" data-filter="admin" aria-pressed="false">Admin</button>
    <button class="chip" data-filter="staff" aria-pressed="false">Staff</button>
    <button class="chip" data-filter="active" aria-pressed="false">Active</button>
    <button class="chip" data-filter="inactive" aria-pressed="false">Inactive</button>
    <button class="chip" data-filter="pending-invite" aria-pressed="false" hidden>Pending invite</button>
    <button class="chip" data-filter="banned" aria-pressed="false">Banned</button>
  </nav>

  <main>
    <p class="door-only door-data-status" id="doorDataStatus" role="status" hidden></p>
    <h2 class="results-heading" id="resultsHeading" aria-live="polite" tabindex="-1">Members</h2>
    <div class="list" id="list"></div>
    <div class="empty" id="empty" style="display:none;">No members match this filter.</div>

    <div class="pagination" id="pagination">
      <div class="page-nav">
        <button id="prevPage" aria-label="Previous page">‹</button>
        <span id="pageInfo">Page 1 of 1</span>
        <button id="nextPage" aria-label="Next page">›</button>
      </div>
      <div class="per-page">
        <label for="perPage">Results per page</label>
        <select id="perPage">
          <option value="10">10</option>
          <option value="15">15</option>
          <option value="20">20</option>
        </select>
      </div>
    </div>
  </main>

  <button class="fab admin-only" id="addBtn" title="Add member" aria-label="Add member">+</button>

  <dialog class="modal scan-dialog" id="scanDialog" aria-labelledby="scanTitle">
    <button class="modal-close" type="button" id="scanCloseBtn" aria-label="Close scanner" autofocus>✕</button>
    <h2 class="modal-name" id="scanTitle">Scan membership QR</h2>
    <div id="scanReader"></div>
    <p class="modal-feedback" id="scanStatus" role="status"></p>
    <button class="modal-btn" type="button" id="scanRetryBtn" hidden>Retry lookup</button>
  </dialog>

  <div class="modal-overlay" id="memberModalOverlay">
    <div class="modal member-detail" role="dialog" aria-modal="true" aria-labelledby="modalName">
      <button class="modal-close" id="modalCloseBtn" aria-label="Close">✕</button>

      <h2 class="modal-name" id="modalName"></h2>
      <div class="modal-member-number" id="modalMemberNumber"></div>

      <div class="modal-meta">
        <div class="modal-row">
          <span class="modal-label">Status</span>
          <span class="badge badge-status" id="modalStatus"><span class="dot"></span><span id="modalStatusText"></span></span>
        </div>
        <div class="modal-row">
          <span class="modal-label">Membership Type</span>
          <span class="modal-value" id="modalMembershipType"></span>
        </div>
        <div class="modal-row">
          <span class="modal-label">Checked-In</span>
          <span class="modal-value" id="modalCheckedIn"></span>
        </div>
        <div class="modal-row">
          <span class="modal-label">Email</span>
          <span id="modalEmail"></span>
        </div>
      </div>

      <div class="modal-actions">
        <button class="modal-btn modal-btn-checkin admin-only" id="modalCompBtn" type="button">Comp</button>
        <button class="modal-btn modal-btn-checkin door-only" id="modalCheckInBtn">Check In</button>
        <button class="modal-btn modal-btn-danger door-only" id="modalOverrideBtn" title="Override the event’s membership requirement">Override</button>
        <button class="modal-btn admin-only" id="modalEditBtn">Edit</button>
        <button class="modal-btn modal-btn-danger admin-only" id="modalBanBtn">Ban</button>
        <button class="modal-btn modal-btn-accent" id="modalResendQrBtn" type="button">Resend QR</button>
      </div>
      <p class="modal-feedback" id="modalCheckInFeedback" role="status" hidden></p>
      <p class="modal-feedback admin-only" id="modalBanFeedback" role="status" hidden></p>
      <p class="modal-feedback" id="modalResendQrFeedback" role="status" hidden></p>

      <section class="modal-history" aria-label="Member activity">
        <div class="modal-pills" role="group" aria-label="Member activity view">
          <button class="chip" type="button" id="modalCheckInsTab" aria-pressed="true" aria-controls="modalCheckInsPanel">Check-Ins</button>
          <button class="chip" type="button" id="modalNotesTab" aria-pressed="false" aria-controls="modalNotesPanel">
            <span class="note-warning" id="modalNoteWarning" aria-label="Member has notes" role="img" hidden></span>Notes
          </button>
        </div>
        <div id="modalCheckInsPanel">
          <p class="modal-feedback" id="modalCheckInsMessage" role="status" hidden></p>
          <ul class="modal-entries" id="modalCheckInsList"></ul>
        </div>
        <div id="modalNotesPanel" hidden>
          <button class="modal-link" type="button" id="modalAddNote" aria-expanded="false" aria-controls="modalNoteForm">Add Note</button>
          <form class="modal-note-form" id="modalNoteForm" hidden>
            <label for="modalNoteContent">Note</label>
            <textarea id="modalNoteContent" rows="3" maxlength="2000" required></textarea>
            <div class="modal-form-actions">
              <button class="modal-btn modal-btn-accent" type="submit" id="modalSaveNote">Save Note</button>
              <button class="modal-btn" type="button" id="modalCancelNote">Cancel</button>
            </div>
          </form>
          <p class="modal-feedback" id="modalNoteFeedback" role="status" hidden></p>
          <p class="modal-feedback" id="modalNotesMessage" role="status" hidden></p>
          <ul class="modal-entries" id="modalNotesList"></ul>
        </div>
      </section>
    </div>
  </div>

  <dialog class="modal note-delete-dialog" id="noteDeleteDialog" aria-labelledby="noteDeleteTitle">
    <h2 class="modal-name" id="noteDeleteTitle">Delete this note?</h2>
    <p class="modal-feedback" id="noteDeleteFeedback" role="status" hidden></p>
    <form class="modal-form-actions" id="noteDeleteForm" method="dialog">
      <button class="modal-btn modal-btn-danger" type="submit" value="yes" id="noteDeleteYes">Yes</button>
      <button class="modal-btn" type="submit" value="no" id="noteDeleteNo" autofocus>No</button>
    </form>
  </dialog>

  <dialog class="modal admin-editor" id="adminEditor" aria-labelledby="adminEditorTitle">
    <button class="modal-close" type="button" id="adminEditorClose" aria-label="Close">✕</button>
    <h2 class="modal-name" id="adminEditorTitle"></h2>
    <form id="adminEditorForm">
      <div class="editor-fields" id="adminEditorFields"></div>
      <p class="modal-feedback" id="adminEditorFeedback" role="status" hidden></p>
      <div class="modal-form-actions">
        <button class="modal-btn modal-btn-accent" type="submit" id="adminEditorSave">Save</button>
        <button class="modal-btn" type="button" id="adminEditorResendInvite" hidden>Resend invite</button>
        <button class="modal-btn modal-btn-danger" type="submit" id="adminEditorDeactivate" formnovalidate hidden>Deactivate</button>
      </div>
    </form>
  </dialog>

  <template id="memberFields">
    <label>First name <input name="firstName" required maxlength="100" autocomplete="off"></label>
    <label>Last name <input name="lastName" required maxlength="100" autocomplete="off"></label>
    <label>Email <input name="email" type="email" required maxlength="255" autocomplete="off"></label>
    <label id="editorMembership" hidden>Membership type
      <select name="membershipType" disabled>
        <option value="" disabled hidden>No active membership</option>
        <option value="FREE">Free</option>
        <option value="PAID">Paid</option>
      </select>
    </label>
  </template>

  <template id="newUserFields">
    <label>Member <input id="userMemberSearch" type="search" placeholder="Name, member number, or email" autocomplete="off" maxlength="255" autofocus></label>
    <div id="userMemberMatches" class="member-matches" role="group" aria-label="Matching members" hidden></div>
    <p id="userMemberSearchStatus" class="modal-feedback" role="status" hidden></p>
    <label>Role <select name="role"><option value="STAFF">Staff</option><option value="ADMIN">Admin</option></select></label>
  </template>

  <template id="editUserFields">
    <label>Full name <input name="name" readonly></label>
    <label>Role <select name="role" required><option value="STAFF">Staff</option><option value="ADMIN">Admin</option></select></label>
    <label class="editor-check"><input name="enabled" type="checkbox"> Account enabled</label>
  </template>

  <template id="eventFields">
    <label>Name <input name="name" required></label>
    <label>Location <select name="location"><option value="OUTLAND">OUTLAND</option></select></label>
    <label>Starts at <input name="startsAt" type="datetime-local" step="1"></label>
    <label>Ends at <input name="endsAt" type="datetime-local" step="1"></label>
    <label class="editor-check"><input name="membershipRequired" type="checkbox"> Membership required</label>
    <label class="editor-check"><input name="coverRequired" type="checkbox"> Cover required</label>
  </template>

  <div class="check-in-toast-region" role="status">
    <div class="check-in-toast" id="checkInToast" hidden>
      <span class="check-in-toast-icon" aria-hidden="true">✓</span>
      <span id="checkInToastMessage"></span>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/router.js"></script>
  <script src="js/vendor/html5-qrcode-2.3.8.min.js"></script>
  <script src="js/door.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/members.js"></script>

</body>
</html>
